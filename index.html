<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBIT — DC</title>
  <meta name="description" content="ORBIT DC — events in Washington, DC.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23060607' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d6e8f5' stroke-width='1.2'/%3E%3Ccircle cx='23.4' cy='9.2' r='1.7' fill='%23d6e8f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="mast">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1"/>
          <circle cx="18.15" cy="6.35" r="1.35" fill="currentColor"/>
        </svg>
        <span class="wordmark">ORBIT</span>
        <span class="rule"></span>
        <span class="city">DC</span>
      </div>
      <div class="mast-meta">
        <span class="pulse" id="pulse" hidden></span>
        <span class="stat" id="stat">—</span>
        <span class="updated" id="updated">UPDATED <time datetime="">—</time></span>
      </div>
    </header>

    <section class="filterbar" id="filterbar">
      <div class="filterbar-meta">
        <span class="showing" id="showing">SHOWING —</span>
        <button type="button" class="chip clear" id="btn-clear" hidden>CLEAR</button>
      </div>
      <div class="filters" id="filters" aria-label="Filters"></div>
    </section>

    <section class="toolbar">
      <div class="nav">
        <button type="button" class="ghost" id="btn-today" title="Jump to today (T)">TODAY</button>
        <div class="stepper">
          <button type="button" class="icon" id="btn-prev" aria-label="Previous period">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 2.4 4.6 8l5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button type="button" class="icon" id="btn-next" aria-label="Next period">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 2.4 11.4 8l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
        <h1 class="period" id="period">—</h1>
      </div>
      <div class="view-toggle" role="tablist" aria-label="Calendar view">
        <button type="button" role="tab" id="btn-week" aria-selected="true">WEEK</button>
        <button type="button" role="tab" id="btn-month" aria-selected="false">MONTH</button>
      </div>
    </section>

    <main class="board" id="board" tabindex="-1"></main>

    <footer class="colophon" id="colophon"></footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-hidden="true"></aside>

  <noscript><p style="max-width:40rem;margin:2rem auto;color:#7a7874;font-family:IBM Plex Mono,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;">JavaScript is required to read events.json.</p></noscript>
  <script src="js/app.js" defer></script>
</body>
</html>
